<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <defs>
    <linearGradient id="vcdBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E242B"/>
      <stop offset="100%" stop-color="#0E1217"/>
    </linearGradient>
    <linearGradient id="vcdFan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#14181F"/>
    </linearGradient>
  </defs>

  <!-- PCIe IO Shield Bracket (Left) -->
  <path d="M 4 4 L 8 4 L 8 44 L 4 44 Z" fill="#475569" stroke="#334155" stroke-width="0.8"/>
  <rect x="5" y="10" width="2" height="6" rx="0.5" fill="#0F172A"/>
  <rect x="5" y="20" width="2" height="8" rx="0.5" fill="#0F172A"/>
  <rect x="5" y="31" width="2" height="8" rx="0.5" fill="#0F172A"/>

  <!-- Main GPU Body Shroud (Muted / Power Off) -->
  <rect x="8" y="6" width="84" height="34" rx="4" fill="url(#vcdBody)" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- PCIe Inactive Contact Fingers (Bottom) -->
  <g transform="translate(22, 40)">
    <rect x="0" y="0" width="38" height="5" fill="#0A0F14"/>
    <g fill="#475569" opacity="0.6">
      <rect x="2" y="1" width="1.5" height="3.5"/>
      <rect x="4.5" y="1" width="1.5" height="3.5"/>
      <rect x="7" y="1" width="1.5" height="3.5"/>
      <rect x="9.5" y="1" width="1.5" height="3.5"/>
      <rect x="13" y="1" width="1.5" height="3.5"/>
      <rect x="15.5" y="1" width="1.5" height="3.5"/>
      <rect x="18" y="1" width="1.5" height="3.5"/>
      <rect x="20.5" y="1" width="1.5" height="3.5"/>
      <rect x="23" y="1" width="1.5" height="3.5"/>
      <rect x="25.5" y="1" width="1.5" height="3.5"/>
      <rect x="28" y="1" width="1.5" height="3.5"/>
      <rect x="30.5" y="1" width="1.5" height="3.5"/>
      <rect x="33" y="1" width="1.5" height="3.5"/>
      <rect x="35.5" y="1" width="1.5" height="3.5"/>
    </g>
  </g>

  <!-- Left Stopped Fan -->
  <g transform="translate(32, 23)" opacity="0.5">
    <circle cx="0" cy="0" r="13" fill="#070A0E" stroke="#334155" stroke-width="1"/>
    <path d="M 0 -2 C 4 -6 8 -7 10 -4 C 8 -2 5 -1 0 -0.5 Z" fill="url(#vcdFan)"/>
    <path d="M 2 0 C 6 4 7 8 4 10 C 2 8 1 5 0.5 0 Z" fill="url(#vcdFan)"/>
    <path d="M 0 2 C -4 6 -8 7 -10 4 C -8 2 -5 1 -0.5 0.5 Z" fill="url(#vcdFan)"/>
    <path d="M -2 0 C -6 -4 -7 -8 -4 -10 C -2 -8 -1 -5 -0.5 -0 Z" fill="url(#vcdFan)"/>
    <circle cx="0" cy="0" r="4.5" fill="#1E293B"/>
  </g>

  <!-- Right Stopped Fan -->
  <g transform="translate(68, 23)" opacity="0.5">
    <circle cx="0" cy="0" r="13" fill="#070A0E" stroke="#334155" stroke-width="1"/>
    <path d="M 0 -2 C 4 -6 8 -7 10 -4 C 8 -2 5 -1 0 -0.5 Z" fill="url(#vcdFan)"/>
    <path d="M 2 0 C 6 4 7 8 4 10 C 2 8 1 5 0.5 0 Z" fill="url(#vcdFan)"/>
    <path d="M 0 2 C -4 6 -8 7 -10 4 C -8 2 -5 1 -0.5 0.5 Z" fill="url(#vcdFan)"/>
    <path d="M -2 0 C -6 -4 -7 -8 -4 -10 C -2 -8 -1 -5 -0.5 -0 Z" fill="url(#vcdFan)"/>
    <circle cx="0" cy="0" r="4.5" fill="#1E293B"/>
  </g>

  <!-- Power Off / Sleep Moon Badge (Center) -->
  <g transform="translate(50, 23)">
    <circle cx="0" cy="0" r="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
    <!-- Crescent Moon / Sleep Icon -->
    <path d="M -2 -4 C -2 1 2 4 4 4 C 1 5 -4 3 -4 -1 C -4 -4 -2 -4 -2 -4 Z" fill="#FBBF24"/>
  </g>
</svg>
