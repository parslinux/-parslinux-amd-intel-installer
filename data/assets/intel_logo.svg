<svg width="72" height="72" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="intelBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2238"/>
      <stop offset="100%" stop-color="#050e18"/>
    </linearGradient>
    <linearGradient id="intelBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C7FD"/>
      <stop offset="100%" stop-color="#0071C5"/>
    </linearGradient>
    <filter id="intelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00C7FD" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#intelBadgeBg)" stroke="#00C7FD" stroke-width="1.5"/>
  <g transform="translate(15, 18)" filter="url(#intelGlow)">
    <!-- Intel Stylized Arc / Iris Logo -->
    <text x="17" y="21" font-family="sans-serif" font-weight="bold" font-size="20" fill="url(#intelBlue)" text-anchor="middle" letter-spacing="-1">intel</text>
    <!-- Dot on the 'i' spark -->
    <circle cx="4" cy="5" r="2.2" fill="#00E5FF"/>
    <!-- Swoosh arc -->
    <path d="M-2,3 C12,-5 26,-5 36,3" fill="none" stroke="url(#intelBlue)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
