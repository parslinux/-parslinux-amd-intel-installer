<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <defs>
    <linearGradient id="vcBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="50%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="vcFan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="vcGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="vcNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76B900"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
  </defs>

  <!-- PCIe IO Shield Bracket (Left) -->
  <path d="M 4 4 L 8 4 L 8 44 L 4 44 Z" fill="#94A3B8" stroke="#64748B" stroke-width="0.8"/>
  <rect x="5" y="10" width="2" height="6" rx="0.5" fill="#1E293B"/>
  <rect x="5" y="20" width="2" height="8" rx="0.5" fill="#1E293B"/>
  <rect x="5" y="31" width="2" height="8" rx="0.5" fill="#1E293B"/>

  <!-- Main GPU Body Shroud -->
  <rect x="8" y="6" width="84" height="34" rx="4" fill="url(#vcBody)" stroke="#374151" stroke-width="1.2"/>

  <!-- Heatsink Aluminum Fin Texture (Top/Bottom vents) -->
  <g stroke="#374151" stroke-width="0.8" opacity="0.6">
    <line x1="14" y1="8" x2="14" y2="11"/>
    <line x1="18" y1="8" x2="18" y2="11"/>
    <line x1="22" y1="8" x2="22" y2="11"/>
    <line x1="26" y1="8" x2="26" y2="11"/>
    <line x1="30" y1="8" x2="30" y2="11"/>
    <line x1="34" y1="8" x2="34" y2="11"/>
    <line x1="58" y1="8" x2="58" y2="11"/>
    <line x1="62" y1="8" x2="62" y2="11"/>
    <line x1="66" y1="8" x2="66" y2="11"/>
    <line x1="70" y1="8" x2="70" y2="11"/>
    <line x1="74" y1="8" x2="74" y2="11"/>
    <line x1="78" y1="8" x2="78" y2="11"/>
    <line x1="82" y1="8" x2="82" y2="11"/>
  </g>

  <!-- Neon LED RGB Trim Stripe -->
  <path d="M 12 9 L 84 9" stroke="url(#vcNeon)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- PCIe Golden Contact Fingers (Bottom) -->
  <g transform="translate(22, 40)">
    <rect x="0" y="0" width="38" height="5" fill="#0F172A"/>
    <g fill="url(#vcGold)">
      <rect x="2" y="1" width="1.5" height="3.5"/>
      <rect x="4.5" y="1" width="1.5" height="3.5"/>
      <rect x="7" y="1" width="1.5" height="3.5"/>
      <rect x="9.5" y="1" width="1.5" height="3.5"/>
      <rect x="13" y="1" width="1.5" height="3.5"/>
      <rect x="15.5" y="1" width="1.5" height="3.5"/>
      <rect x="18" y="1" width="1.5" height="3.5"/>
      <rect x="20.5" y="1" width="1.5" height="3.5"/>
      <rect x="23" y="1" width="1.5" height="3.5"/>
      <rect x="25.5" y="1" width="1.5" height="3.5"/>
      <rect x="28" y="1" width="1.5" height="3.5"/>
      <rect x="30.5" y="1" width="1.5" height="3.5"/>
      <rect x="33" y="1" width="1.5" height="3.5"/>
      <rect x="35.5" y="1" width="1.5" height="3.5"/>
    </g>
  </g>

  <!-- Left Active Cooling Fan -->
  <g transform="translate(32, 23)">
    <circle cx="0" cy="0" r="13" fill="#0B0F17" stroke="#4B5563" stroke-width="1"/>
    <circle cx="0" cy="0" r="11.5" fill="none" stroke="#76B900" stroke-width="0.8" opacity="0.8"/>
    <!-- Blades -->
    <path d="M 0 -2 C 4 -6 8 -7 10 -4 C 8 -2 5 -1 0 -0.5 Z" fill="url(#vcFan)"/>
    <path d="M 2 0 C 6 4 7 8 4 10 C 2 8 1 5 0.5 0 Z" fill="url(#vcFan)"/>
    <path d="M 0 2 C -4 6 -8 7 -10 4 C -8 2 -5 1 -0.5 0.5 Z" fill="url(#vcFan)"/>
    <path d="M -2 0 C -6 -4 -7 -8 -4 -10 C -2 -8 -1 -5 -0.5 -0 Z" fill="url(#vcFan)"/>
    <!-- Center Hub -->
    <circle cx="0" cy="0" r="4.5" fill="#1F2937" stroke="#374151" stroke-width="0.75"/>
    <circle cx="0" cy="0" r="2.5" fill="#76B900"/>
  </g>

  <!-- Right Active Cooling Fan -->
  <g transform="translate(68, 23)">
    <circle cx="0" cy="0" r="13" fill="#0B0F17" stroke="#4B5563" stroke-width="1"/>
    <circle cx="0" cy="0" r="11.5" fill="none" stroke="#00D2FF" stroke-width="0.8" opacity="0.8"/>
    <!-- Blades -->
    <path d="M 0 -2 C 4 -6 8 -7 10 -4 C 8 -2 5 -1 0 -0.5 Z" fill="url(#vcFan)"/>
    <path d="M 2 0 C 6 4 7 8 4 10 C 2 8 1 5 0.5 0 Z" fill="url(#vcFan)"/>
    <path d="M 0 2 C -4 6 -8 7 -10 4 C -8 2 -5 1 -0.5 0.5 Z" fill="url(#vcFan)"/>
    <path d="M -2 0 C -6 -4 -7 -8 -4 -10 C -2 -8 -1 -5 -0.5 -0 Z" fill="url(#vcFan)"/>
    <!-- Center Hub -->
    <circle cx="0" cy="0" r="4.5" fill="#1F2937" stroke="#374151" stroke-width="0.75"/>
    <circle cx="0" cy="0" r="2.5" fill="#00D2FF"/>
  </g>

  <!-- Center Active Status LED -->
  <circle cx="50" cy="23" r="2" fill="#10B981"/>
</svg>
